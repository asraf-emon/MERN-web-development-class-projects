<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thatix - Cooking Recipe</title>
    <!-- Fav icon -->
    <link
      rel="shortcut icon"
      href="./src/assets/favicon/fav.png"
      type="image/x-icon"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Internal CSS -->
    <link rel="stylesheet" href="./src/css/style.css" />
  </head>
  <body>
    <!-- Navbar Section -->
    <nav class="navbar navbar-expand-sm bg-white sticky-top">
      <div class="container py-3">
        <img
          src="./src/assets/images/logo.png"
          alt="logo"
          class="img-fluid logo-img mx-auto d-block"
        />
      </div>
    </nav>

    <!-- Hero Section -->
    <div
      class="container-fluid hero-container d-flex justify-content-center align-items-center"
    >
      <div class="">
        <div class="">
          <h1 class="text-center text-white motto">
            Search Your <br />
            Favorite Recipe
          </h1>

          <h2 class="text-center text-white h5">
            A handful of simple ingredients typify the fresh, vibrant <br />
            flavors of Greek cooking
          </h2>
        </div>
      </div>
    </div>

    <!-- Search Section -->
    <div class="container my-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="input-group input-wrapper">
            <input
              type="search"
              placeholder="Search..."
              class="form-control py-2 input-field search-input"
            />
            <span class="search-icon-box">
              <i class="fa-solid fa-magnifying-glass text-white"></i>
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Recipe Section -->
    <div class="container">
      <h1 class="text-center mb-4 display-6 fw-normal">Latest Recipes</h1>

      <div class="text-center py-5" id="loading-message" style="display: none">
        <div class="spinner-border text-warning" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Loading recipes, please wait...</p>
      </div>
    </div>

    <div class="container mb-5">
      <div class="row g-4" id="recipe-cards-container"></div>
    </div>

    <div
      class="modal fade"
      id="recipeDetailModal"
      tabindex="-1"
      aria-labelledby="recipeDetailModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="recipeDetailModalLabel">
              Recipe Details
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="modal-body-content"></div>
        </div>
      </div>
    </div>

    <!-- Footer Section -->
    <footer class="text-white py-3 mt-5">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-sm-6 text-center text-sm-start">
            <p class="mb-0">
              Copyright &copy; 2026 Developed by Asraf Emon | All Rights
              Reserved
            </p>
          </div>

          <div class="col-sm-6 text-center text-sm-end">
            <a
              href="https://x.com/AsrafEmon007"
              class="text-white me-3 footer-icon"
              target="_blank"
            >
              <i class="fa-brands fa-twitter"></i>
            </a>
            <a href="#" class="text-white me-3 footer-icon" target="_blank">
              <i class="fa-brands fa-youtube fa-lg"></i>
            </a>
            <a
              href="https://www.facebook.com/asrafemon15"
              class="text-white footer-icon"
              target="_blank"
            >
              <i class="fa-brands fa-facebook-f fa-lg"></i>
            </a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Scroll to Top Section -->
    <button id="scrollToTopBtn" title="Scroll to Top">
      <svg class="progress-ring" width="60" height="60">
        <circle
          class="progress-ring-track"
          stroke="#e6e6e6"
          stroke-width="4"
          fill="transparent"
          r="28"
          cx="30"
          cy="30"
        />
        <circle
          id="progressCircle"
          class="progress-ring-progress"
          stroke="#ffa500"
          stroke-width="4"
          fill="transparent"
          r="28"
          cx="30"
          cy="30"
          style="stroke-dasharray: 175.9; stroke-dashoffset: 175.9"
        />
      </svg>
      <div class="button-content">
        <i class="fas fa-arrow-up scroll-icon"></i>
        <span id="scrollPercentage" class="percentage-text">0%</span>
      </div>
    </button>

    <!-- Bootstrap JavaScript -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Internal JavaScript -->
    <script src="./src/js/script.js"></script>
  </body>
</html>
